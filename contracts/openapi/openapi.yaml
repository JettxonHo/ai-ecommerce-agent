components:
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Project-defined retry identity scoped to the current fixed workspace and operation.
      schema:
        type: string
        minLength: 1
        maxLength: 200
    TaskLimit:
      name: limit
      in: query
      required: false
      description: Server-bounded recent-task window size.
      schema:
        type: integer
        minimum: 1
        maximum: 50
        default: 20
    BriefLimit:
      name: limit
      in: query
      required: false
      description: Server-bounded recent Brief version window size.
      schema:
        type: integer
        minimum: 1
        maximum: 25
        default: 10
    TaskId:
      name: taskId
      in: path
      required: true
      schema:
        type: string
        minLength: 1
    RunId:
      name: runId
      in: path
      required: true
      schema:
        type: string
        minLength: 1
    ActionRequestId:
      name: actionRequestId
      in: path
      required: true
      schema:
        type: string
        minLength: 1
    SourceAssociationId:
      name: sourceAssociationId
      in: path
      required: true
      schema:
        type: string
        minLength: 1
    ReviewPackageId:
      name: reviewPackageId
      in: path
      required: true
      schema:
        type: string
        minLength: 1
    ApprovedStrategyVersionId:
      name: approvedStrategyVersionId
      in: path
      required: true
      schema:
        type: string
        minLength: 1
    MarketingBriefVersionId:
      name: marketingBriefVersionId
      in: path
      required: true
      schema:
        type: string
        minLength: 1
    XiaohongshuBriefVersionId:
      name: xiaohongshuBriefVersionId
      in: path
      required: true
      schema:
        type: string
        minLength: 1
    ExportSnapshotId:
      name: exportSnapshotId
      in: path
      required: true
      schema:
        type: string
        minLength: 1
  responses:
    Problem400:
      description: Malformed request
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetails' }
    Problem404:
      description: Resource does not exist in the fixed workspace
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetails' }
    Problem409:
      description: Typed revision, idempotency, supersession, capability, or in-progress conflict
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetails' }
    Problem413:
      description: Request or upload boundary is too large
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetails' }
    Problem415:
      description: Unsupported request media type
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetails' }
    Problem422:
      description: Semantically invalid or unprocessable input
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetails' }
    Problem429:
      description: HTTP request was rate limited
      headers:
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetails' }
    Problem500:
      description: Safe internal error projection
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetails' }
    Problem503:
      description: Service unavailable at the HTTP boundary
      headers:
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetails' }
    ProblemDefault:
      description: RFC 9457 problem projection
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetails' }
  headers:
    RetryAfter:
      description: Optional bounded retry hint; exact backoff is owned by RFC-007.
      schema:
        type: integer
        minimum: 0
    Location:
      description: Canonical resource or Run monitor URI.
      schema:
        type: string
        format: uri-reference
    ContentDisposition:
      description: Attachment disposition with an ASCII-safe Markdown filename.
      schema:
        type: string
  schemas:
    ResourceReference:
      type: object
      required: [resourceKind, resourceId]
      properties:
        resourceKind:
          type: string
          minLength: 1
        resourceId:
          type: string
          minLength: 1
    MutableResourceReference:
      allOf:
        - $ref: '#/components/schemas/ResourceReference'
        - type: object
          required: [revision]
          properties:
            revision:
              $ref: '#/components/schemas/ResourceRevision'
    DomainVersionReference:
      type: object
      additionalProperties: false
      required: [resourceKind, resourceVersionId, versionNumber]
      properties:
        resourceKind:
          type: string
          minLength: 1
        resourceVersionId:
          type: string
          minLength: 1
        versionNumber:
          type: integer
          minimum: 1
    ResourceRevision:
      type: integer
      minimum: 0
    TaskReference:
      type: object
      additionalProperties: false
      required: [taskId]
      properties:
        taskId:
          type: string
          minLength: 1
    RunReference:
      type: object
      additionalProperties: false
      required: [runId]
      properties:
        runId:
          type: string
          minLength: 1
    StageReference:
      type: string
      enum:
        - product_intake_and_fact_extraction
        - customer_insight_analysis
        - product_positioning
        - human_review
        - marketing_brief_generation
        - xiaohongshu_brief_mapping
    StageStatus:
      type: string
      enum: [not_started, ready, running, waiting_input, waiting_review, valid, invalid, failed, skipped]
    StageSummary:
      type: object
      additionalProperties: false
      required: [stage, status, currentVersion, lastValidVersion, lastRun, waitingReason, updatedAt]
      properties:
        stage: { $ref: '#/components/schemas/StageReference' }
        status: { $ref: '#/components/schemas/StageStatus' }
        currentVersion:
          oneOf:
            - $ref: '#/components/schemas/DomainVersionReference'
            - type: 'null'
        lastValidVersion:
          oneOf:
            - $ref: '#/components/schemas/DomainVersionReference'
            - type: 'null'
        lastRun:
          oneOf:
            - $ref: '#/components/schemas/RunReference'
            - type: 'null'
        waitingReason:
          oneOf:
            - type: string
            - type: 'null'
        updatedAt:
          type: string
          format: date-time
    TaskStatus:
      type: string
      enum: [draft, running, waiting_for_input, waiting_for_review, paused, completed, failed, cancelled]
    RunStatus:
      type: string
      enum: [queued, running, retrying, waiting_for_input, waiting_for_review, paused, cancellation_requested, completed, failed, cancelled, superseded]
    Capability:
      type: string
      enum:
        - start
        - cancel
        - resume
        - rerun
        - retry_current_stage
        - restart_from_safe_boundary
        - resolve_needs_input
        - preview_remove_source
        - remove_source
        - preview_replace_source
        - replace_source
        - save_review_draft
        - submit_review
        - request_more_information
        - reject_all_and_request_regeneration
        - withdraw_approved_strategy
        - compare_brief
        - revise_marketing_brief
        - revise_xiaohongshu_brief
        - preview_export
        - confirm_export
    PrimaryAction:
      oneOf:
        - $ref: '#/components/schemas/NoPrimaryAction'
        - $ref: '#/components/schemas/NavigatePrimaryAction'
        - $ref: '#/components/schemas/CommandPrimaryAction'
      discriminator:
        propertyName: type
    NoPrimaryAction:
      type: object
      additionalProperties: false
      required: [type]
      properties:
        type:
          const: none
    NavigatePrimaryAction:
      type: object
      additionalProperties: false
      required: [type, target]
      properties:
        type:
          const: navigate
        target:
          type: string
          enum: [intake, needs_input, review, results, recovery]
    CommandPrimaryAction:
      type: object
      additionalProperties: false
      required: [type, command]
      properties:
        type:
          const: command
        command: { $ref: '#/components/schemas/Capability' }
    CreateTaskRequest:
      type: object
      additionalProperties: false
      required: [taskName, productCategory, promotionGoal]
      properties:
        taskName:
          type: string
          minLength: 1
        productCategory:
          type: string
          minLength: 1
        promotionGoal:
          type: string
          minLength: 1
    TaskSummary:
      type: object
      required: [taskId, taskName, productCategory, taskStatus, currentStage, waitingReason, updatedAt, revision, primaryAction, capabilities]
      properties:
        taskId:
          type: string
          minLength: 1
        taskName:
          type: string
          minLength: 1
        productCategory:
          type: string
          minLength: 1
        taskStatus: { $ref: '#/components/schemas/TaskStatus' }
        currentStage:
          oneOf:
            - $ref: '#/components/schemas/StageReference'
            - type: 'null'
        waitingReason:
          oneOf:
            - type: string
            - type: 'null'
        updatedAt:
          type: string
          format: date-time
        revision: { $ref: '#/components/schemas/ResourceRevision' }
        primaryAction: { $ref: '#/components/schemas/PrimaryAction' }
        capabilities:
          type: array
          items: { $ref: '#/components/schemas/Capability' }
          uniqueItems: true
    TaskSummaryList:
      type: object
      additionalProperties: false
      required: [items, limit]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/TaskSummary' }
        limit:
          type: integer
          minimum: 1
          maximum: 50
    TaskOverview:
      allOf:
        - $ref: '#/components/schemas/TaskSummary'
        - type: object
          additionalProperties: false
          required: [stages, activeRun, latestRun, needsInputRequest, reviewPackage, approvedStrategy, marketingBrief, xiaohongshuBrief]
          properties:
            stages:
              type: array
              items: { $ref: '#/components/schemas/StageSummary' }
            activeRun:
              oneOf:
                - $ref: '#/components/schemas/RunReference'
                - type: 'null'
            latestRun:
              oneOf:
                - $ref: '#/components/schemas/RunReference'
                - type: 'null'
            needsInputRequest:
              oneOf:
                - $ref: '#/components/schemas/MutableResourceReference'
                - type: 'null'
            reviewPackage:
              oneOf:
                - $ref: '#/components/schemas/ReviewPackageReference'
                - type: 'null'
            approvedStrategy:
              oneOf:
                - $ref: '#/components/schemas/DomainVersionReference'
                - type: 'null'
            marketingBrief:
              oneOf:
                - $ref: '#/components/schemas/DomainVersionReference'
                - type: 'null'
            xiaohongshuBrief:
              oneOf:
                - $ref: '#/components/schemas/DomainVersionReference'
                - type: 'null'
    CommandReceipt:
      type: object
      additionalProperties: false
      required: [commandId, commandType, taskId, acceptedAt, monitor, resultReference]
      example:
        commandId: command-01
        commandType: start
        taskId: task-01
        acceptedAt: '2026-08-08T00:00:00Z'
        monitor:
          runId: run-01
        resultReference: null
      properties:
        commandId:
          type: string
          minLength: 1
        commandType:
          type: string
          minLength: 1
        taskId:
          type: string
          minLength: 1
        acceptedAt:
          type: string
          format: date-time
        monitor: { $ref: '#/components/schemas/RunReference' }
        resultReference:
          oneOf:
            - $ref: '#/components/schemas/ResourceReference'
            - $ref: '#/components/schemas/DomainVersionReference'
            - type: 'null'
    Run:
      type: object
      additionalProperties: false
      required: [runId, taskId, revision, sourceRunId, status, currentStage, startedAt, updatedAt, completedAt, failureSummary, lastValidResult, primaryAction, capabilities]
      example:
        runId: run-01
        taskId: task-01
        revision: 0
        sourceRunId: null
        status: queued
        currentStage: product_intake_and_fact_extraction
        startedAt: null
        updatedAt: '2026-08-08T00:00:00Z'
        completedAt: null
        failureSummary: null
        lastValidResult: null
        primaryAction:
          type: none
        capabilities: [cancel]
      properties:
        runId:
          type: string
          minLength: 1
        taskId:
          type: string
          minLength: 1
        revision: { $ref: '#/components/schemas/ResourceRevision' }
        sourceRunId:
          oneOf:
            - type: string
            - type: 'null'
        status: { $ref: '#/components/schemas/RunStatus' }
        currentStage:
          oneOf:
            - $ref: '#/components/schemas/StageReference'
            - type: 'null'
        startedAt:
          oneOf:
            - type: string
              format: date-time
            - type: 'null'
        updatedAt:
          type: string
          format: date-time
        completedAt:
          oneOf:
            - type: string
              format: date-time
            - type: 'null'
        failureSummary:
          oneOf:
            - $ref: '#/components/schemas/SafeFailureSummary'
            - type: 'null'
        lastValidResult:
          oneOf:
            - $ref: '#/components/schemas/ResourceReference'
            - $ref: '#/components/schemas/DomainVersionReference'
            - type: 'null'
        primaryAction: { $ref: '#/components/schemas/PrimaryAction' }
        capabilities:
          type: array
          items: { $ref: '#/components/schemas/Capability' }
          uniqueItems: true
    SafeFailureSummary:
      type: object
      additionalProperties: false
      required: [reasonType, summary, action]
      properties:
        reasonType:
          type: string
          minLength: 1
        summary:
          type: string
          minLength: 1
        action:
          type: string
          enum: [correct_input, refresh, refresh_and_compare, open_current, retry_later, contact_operator, none]
    StartTaskRequest:
      type: object
      additionalProperties: false
      required: [expectedRevision]
      properties:
        expectedRevision: { $ref: '#/components/schemas/ResourceRevision' }
    RerunTaskRequest:
      type: object
      additionalProperties: false
      required: [expectedRevision, earliestStage, affectedStages]
      properties:
        expectedRevision: { $ref: '#/components/schemas/ResourceRevision' }
        earliestStage: { $ref: '#/components/schemas/StageReference' }
        affectedStages:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/StageReference' }
          uniqueItems: true
    CancelRunRequest:
      type: object
      additionalProperties: false
      required: [expectedRevision]
      properties:
        expectedRevision: { $ref: '#/components/schemas/ResourceRevision' }
    ResumeRunRequest:
      type: object
      additionalProperties: false
      required: [expectedRevision]
      properties:
        expectedRevision: { $ref: '#/components/schemas/ResourceRevision' }
    RetryCurrentStageRequest:
      type: object
      additionalProperties: false
      required: [expectedRevision]
      properties:
        expectedRevision: { $ref: '#/components/schemas/ResourceRevision' }
    RestartFromSafeBoundaryRequest:
      type: object
      additionalProperties: false
      required: [expectedRevision, earliestStage]
