openapi: 3.1.0
jsonSchemaDialect: https://spec.openapis.org/oas/3.1/dialect/base
info:
  title: AI E-commerce Agent HTTP API
  version: 0.1.0
  description: |
    Authored, contract-first HTTP boundary for the local MVP-0 fixed workspace.
    This OpenAPI Description is the sole public contract authority. It describes
    resources and typed commands only; it does not imply that an HTTP handler,
    database, worker, model provider, or frontend has been implemented.
servers:
  - url: /
    description: Server-bound loopback same-origin workbench
tags:
  - name: Task
  - name: Run
  - name: Needs Input
  - name: Source Change
  - name: Human Review
  - name: Marketing Brief
  - name: Xiaohongshu Brief
  - name: Export
paths:
  /api/v1/tasks:
    post:
      tags: [Task]
      operationId: createTask
      summary: Create a task without starting workflow execution
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTaskRequest'
            example:
              taskName: City commuter backpack launch
              productCategory: urban commuter backpack
              promotionGoal: clarify positioning for a spring launch
      responses:
        '201':
          description: Task created on the first submission
          headers:
            Location:
              $ref: '#/components/headers/Location'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskOverview'
        '200':
          description: Committed same-input idempotent replay
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskOverview'
        '400': { $ref: '#/components/responses/Problem400' }
        '409': { $ref: '#/components/responses/Problem409' }
        '413': { $ref: '#/components/responses/Problem413' }
        '415': { $ref: '#/components/responses/Problem415' }
        '422': { $ref: '#/components/responses/Problem422' }
        '500': { $ref: '#/components/responses/Problem500' }
        '503': { $ref: '#/components/responses/Problem503' }
    get:
      tags: [Task]
      operationId: listTasks
      summary: List a bounded recent-task window in the fixed workspace
      parameters:
        - $ref: '#/components/parameters/TaskLimit'
      responses:
        '200':
          description: Recent tasks (empty items is a normal response)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskSummaryList'
        '400': { $ref: '#/components/responses/Problem400' }
        '500': { $ref: '#/components/responses/Problem500' }
        '503': { $ref: '#/components/responses/Problem503' }

  /api/v1/tasks/{taskId}:
    get:
      tags: [Task]
      operationId: getTaskOverview
      summary: Read the narrow task navigation overview
      parameters:
        - $ref: '#/components/parameters/TaskId'
      responses:
        '200':
          description: Task overview
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskOverview'
        '404': { $ref: '#/components/responses/Problem404' }
        '500': { $ref: '#/components/responses/Problem500' }
        '503': { $ref: '#/components/responses/Problem503' }

  /api/v1/tasks/{taskId}/commands/start:
    post:
      tags: [Task]
      operationId: startTask
      summary: Durably accept the first workflow run
      parameters:
        - $ref: '#/components/parameters/TaskId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StartTaskRequest'
      responses:
        '202':
          description: Durable command acceptance; execution is not complete
          headers:
            Location:
              $ref: '#/components/headers/Location'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommandReceipt'
        '200':
          description: Committed same-input idempotent replay
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommandReceipt'
        '400': { $ref: '#/components/responses/Problem400' }
        '404': { $ref: '#/components/responses/Problem404' }
        '409': { $ref: '#/components/responses/Problem409' }
        '422': { $ref: '#/components/responses/Problem422' }
        '500': { $ref: '#/components/responses/Problem500' }
        '503': { $ref: '#/components/responses/Problem503' }

  /api/v1/tasks/{taskId}/commands/rerun:
    post:
      tags: [Task]
      operationId: rerunTask
      summary: Confirm and durably accept a stage-scoped rerun
      parameters:
        - $ref: '#/components/parameters/TaskId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RerunTaskRequest'
      responses:
        '202':
          description: Durable rerun acceptance; a new Run identity is monitored
          headers:
            Location:
              $ref: '#/components/headers/Location'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommandReceipt'
        '200':
          description: Committed same-input idempotent replay
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommandReceipt'
        '400': { $ref: '#/components/responses/Problem400' }
        '404': { $ref: '#/components/responses/Problem404' }
        '409': { $ref: '#/components/responses/Problem409' }
        '422': { $ref: '#/components/responses/Problem422' }
        '500': { $ref: '#/components/responses/Problem500' }
        '503': { $ref: '#/components/responses/Problem503' }

  /api/v1/runs/{runId}:
    get:
      tags: [Run]
      operationId: getRun
      summary: Read a Run monitor, including safe failure information
      parameters:
        - $ref: '#/components/parameters/RunId'
      responses:
        '200':
          description: Run representation (including a failed Run)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Run'
        '404': { $ref: '#/components/responses/Problem404' }
        '500': { $ref: '#/components/responses/Problem500' }
        '503': { $ref: '#/components/responses/Problem503' }

  /api/v1/runs/{runId}/commands/cancel:
    post:
      tags: [Run]
      operationId: cancelRun
      summary: Request cooperative cancellation of a specific Run
      parameters:
        - $ref: '#/components/parameters/RunId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CancelRunRequest'
      responses:
        '202':
          description: Cancellation request durably recorded; terminal cancellation is not implied
          headers:
            Location:
              $ref: '#/components/headers/Location'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommandReceipt'
        '200':
          description: Committed same-input idempotent replay
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommandReceipt'
        '400': { $ref: '#/components/responses/Problem400' }
        '404': { $ref: '#/components/responses/Problem404' }
        '409': { $ref: '#/components/responses/Problem409' }
        '422': { $ref: '#/components/responses/Problem422' }
        '500': { $ref: '#/components/responses/Problem500' }
        '503': { $ref: '#/components/responses/Problem503' }

  /api/v1/runs/{runId}/commands/resume:
    post:
      tags: [Run]
      operationId: resumeRun
      summary: Resume a Run only when the server exposes the capability
      parameters:
        - $ref: '#/components/parameters/RunId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResumeRunRequest'
      responses:
        '202':
          description: Durable resume acceptance with a new Run identity
          headers:
            Location:
              $ref: '#/components/headers/Location'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommandReceipt'
        '200':
          description: Committed same-input idempotent replay
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommandReceipt'
        '400': { $ref: '#/components/responses/Problem400' }
        '404': { $ref: '#/components/responses/Problem404' }
        '409': { $ref: '#/components/responses/Problem409' }
        '422': { $ref: '#/components/responses/Problem422' }
        '500': { $ref: '#/components/responses/Problem500' }
        '503': { $ref: '#/components/responses/Problem503' }

  /api/v1/runs/{runId}/commands/retry-current-stage:
    post:
      tags: [Run]
      operationId: retryCurrentStage
      summary: Retry the current stage when capability-gated
      parameters:
        - $ref: '#/components/parameters/RunId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RetryCurrentStageRequest'
      responses:
        '202':
          description: Durable retry acceptance with a new Run identity
          headers:
            Location:
              $ref: '#/components/headers/Location'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommandReceipt'
        '200':
          description: Committed same-input idempotent replay
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommandReceipt'
        '400': { $ref: '#/components/responses/Problem400' }
        '404': { $ref: '#/components/responses/Problem404' }
        '409': { $ref: '#/components/responses/Problem409' }
        '422': { $ref: '#/components/responses/Problem422' }
        '500': { $ref: '#/components/responses/Problem500' }
        '503': { $ref: '#/components/responses/Problem503' }

  /api/v1/runs/{runId}/commands/restart-from-safe-boundary:
    post:
      tags: [Run]
      operationId: restartFromSafeBoundary
      summary: Restart from a capability-gated safe boundary
      parameters:
        - $ref: '#/components/parameters/RunId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RestartFromSafeBoundaryRequest'
      responses:
        '202':
          description: Durable restart acceptance with a new Run identity
          headers:
            Location:
              $ref: '#/components/headers/Location'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommandReceipt'
        '200':
          description: Committed same-input idempotent replay
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommandReceipt'
        '400': { $ref: '#/components/responses/Problem400' }
        '404': { $ref: '#/components/responses/Problem404' }
        '409': { $ref: '#/components/responses/Problem409' }
        '422': { $ref: '#/components/responses/Problem422' }
        '500': { $ref: '#/components/responses/Problem500' }
        '503': { $ref: '#/components/responses/Problem503' }

  /api/v1/needs-input-requests/{actionRequestId}:
    get:
      tags: [Needs Input]
      operationId: getNeedsInputActionRequest
      summary: Read a revision-bound targeted action request
      parameters:
        - $ref: '#/components/parameters/ActionRequestId'
      responses:
        '200':
          description: Needs Input action request, including superseded state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NeedsInputActionRequest'
        '404': { $ref: '#/components/responses/Problem404' }
        '500': { $ref: '#/components/responses/Problem500' }
        '503': { $ref: '#/components/responses/Problem503' }

  /api/v1/needs-input-requests/{actionRequestId}/commands/resolve:
    post:
      tags: [Needs Input]
      operationId: resolveNeedsInput
      summary: Commit a typed Needs Input resolution
      parameters:
        - $ref: '#/components/parameters/ActionRequestId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResolveNeedsInputRequest'
      responses:
        '200':
          description: Resolution committed; the response projects newly legal capabilities
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResolveNeedsInputResult'
        '400': { $ref: '#/components/responses/Problem400' }
        '404': { $ref: '#/components/responses/Problem404' }
        '409': { $ref: '#/components/responses/Problem409' }
        '422': { $ref: '#/components/responses/Problem422' }
        '500': { $ref: '#/components/responses/Problem500' }
        '503': { $ref: '#/components/responses/Problem503' }

  /api/v1/tasks/{taskId}/source-associations/{sourceAssociationId}/previews/remove:
    post:
      tags: [Source Change]
      operationId: previewRemoveSourceAssociation
      summary: Preview the impact of removing a task-scoped source association
      parameters:
        - $ref: '#/components/parameters/TaskId'
        - $ref: '#/components/parameters/SourceAssociationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PreviewSourceChangeRequest'
      responses:
        '200':
          description: Side-effect-free source change preview and basis
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SourceChangePreview'
        '400': { $ref: '#/components/responses/Problem400' }
        '404': { $ref: '#/components/responses/Problem404' }
        '409': { $ref: '#/components/responses/Problem409' }
        '422': { $ref: '#/components/responses/Problem422' }
        '500': { $ref: '#/components/responses/Problem500' }
        '503': { $ref: '#/components/responses/Problem503' }

  /api/v1/tasks/{taskId}/source-associations/{sourceAssociationId}/commands/remove:
    post:
      tags: [Source Change]
      operationId: removeSourceAssociation
      summary: Confirm removal using the server-derived source change basis
      parameters:
        - $ref: '#/components/parameters/TaskId'
        - $ref: '#/components/parameters/SourceAssociationId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConfirmRemoveSourceRequest'
      responses:
        '200':
          description: Removal committed with updated task references
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SourceChangeResult'
        '400': { $ref: '#/components/responses/Problem400' }
        '404': { $ref: '#/components/responses/Problem404' }
        '409': { $ref: '#/components/responses/Problem409' }
        '422': { $ref: '#/components/responses/Problem422' }
        '500': { $ref: '#/components/responses/Problem500' }
        '503': { $ref: '#/components/responses/Problem503' }

  /api/v1/tasks/{taskId}/source-associations/{sourceAssociationId}/previews/replace:
    post:
      tags: [Source Change]
      operationId: previewReplaceSourceAssociation
      summary: Preview replacing a task-scoped source association
      parameters:
        - $ref: '#/components/parameters/TaskId'
        - $ref: '#/components/parameters/SourceAssociationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PreviewReplaceSourceRequest'
      responses:
        '200':
          description: Side-effect-free replacement preview and basis
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SourceChangePreview'
        '400': { $ref: '#/components/responses/Problem400' }
        '404': { $ref: '#/components/responses/Problem404' }
        '409': { $ref: '#/components/responses/Problem409' }
        '422': { $ref: '#/components/responses/Problem422' }
        '500': { $ref: '#/components/responses/Problem500' }
        '503': { $ref: '#/components/responses/Problem503' }

  /api/v1/tasks/{taskId}/source-associations/{sourceAssociationId}/commands/replace:
    post:
      tags: [Source Change]
      operationId: replaceSourceAssociation
      summary: Confirm replacement using the server-derived source change basis
      parameters:
        - $ref: '#/components/parameters/TaskId'
        - $ref: '#/components/parameters/SourceAssociationId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConfirmReplaceSourceRequest'
      responses:
        '200':
          description: Replacement committed with updated task references
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SourceChangeResult'
        '400': { $ref: '#/components/responses/Problem400' }
        '404': { $ref: '#/components/responses/Problem404' }
        '409': { $ref: '#/components/responses/Problem409' }
        '422': { $ref: '#/components/responses/Problem422' }
        '500': { $ref: '#/components/responses/Problem500' }
        '503': { $ref: '#/components/responses/Problem503' }

  /api/v1/review-packages/{reviewPackageId}:
    get:
      tags: [Human Review]
      operationId: getReviewPackage
      summary: Read an immutable review package snapshot
      parameters:
        - $ref: '#/components/parameters/ReviewPackageId'
      responses:
        '200':
          description: Immutable Review Package
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReviewPackage'
        '404': { $ref: '#/components/responses/Problem404' }
        '500': { $ref: '#/components/responses/Problem500' }
        '503': { $ref: '#/components/responses/Problem503' }

  /api/v1/review-packages/{reviewPackageId}/draft:
    get:
      tags: [Human Review]
      operationId: getReviewDraft
      summary: Read the current mutable review draft
      parameters:
        - $ref: '#/components/parameters/ReviewPackageId'
      responses:
        '200':
          description: Current Review Draft snapshot
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReviewDraft'
        '404': { $ref: '#/components/responses/Problem404' }
        '500': { $ref: '#/components/responses/Problem500' }
        '503': { $ref: '#/components/responses/Problem503' }
    put:
      tags: [Human Review]
      operationId: putReviewDraft
      summary: Save a full revision-guarded Review Draft snapshot
      parameters:
        - $ref: '#/components/parameters/ReviewPackageId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PutReviewDraftRequest'
      responses:
        '200':
          description: Canonical Draft snapshot with the next revision
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReviewDraft'
        '400': { $ref: '#/components/responses/Problem400' }
        '404': { $ref: '#/components/responses/Problem404' }
        '409': { $ref: '#/components/responses/Problem409' }
        '422': { $ref: '#/components/responses/Problem422' }
        '500': { $ref: '#/components/responses/Problem500' }
        '503': { $ref: '#/components/responses/Problem503' }

  /api/v1/review-packages/{reviewPackageId}/commands/submit:
    post:
      tags: [Human Review]
      operationId: submitReview
      summary: Submit the latest Review Draft and atomically continue workflow
      parameters:
        - $ref: '#/components/parameters/ReviewPackageId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubmitReviewRequest'
      responses:
        '201':
          description: Review Decision and Approved Strategy created; continuation is durably accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReviewOutcomeResult'
        '200':
          description: Committed same-input idempotent replay
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReviewOutcomeResult'
        '400': { $ref: '#/components/responses/Problem400' }
        '404': { $ref: '#/components/responses/Problem404' }
        '409': { $ref: '#/components/responses/Problem409' }
        '422': { $ref: '#/components/responses/Problem422' }
        '500': { $ref: '#/components/responses/Problem500' }
        '503': { $ref: '#/components/responses/Problem503' }

  /api/v1/review-packages/{reviewPackageId}/commands/request-more-information:
    post:
      tags: [Human Review]
      operationId: requestMoreInformation
      summary: Record a Review outcome that creates or links a Needs Input request
      parameters:
        - $ref: '#/components/parameters/ReviewPackageId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RequestMoreInformationRequest'
      responses:
        '201':
          description: Review outcome and Needs Input request created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReviewOutcomeResult'
        '200':
          description: Committed same-input idempotent replay
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReviewOutcomeResult'
        '400': { $ref: '#/components/responses/Problem400' }
        '404': { $ref: '#/components/responses/Problem404' }
        '409': { $ref: '#/components/responses/Problem409' }
        '422': { $ref: '#/components/responses/Problem422' }
        '500': { $ref: '#/components/responses/Problem500' }
        '503': { $ref: '#/components/responses/Problem503' }

  /api/v1/review-packages/{reviewPackageId}/commands/reject-all-and-request-regeneration:
    post:
      tags: [Human Review]
      operationId: rejectAllAndRequestRegeneration
      summary: Reject all candidates and durably accept regeneration
      parameters:
        - $ref: '#/components/parameters/ReviewPackageId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RejectAllAndRequestRegenerationRequest'
      responses:
        '202':
          description: Regeneration is durably accepted; no Approved Strategy is created
          headers:
            Location:
              $ref: '#/components/headers/Location'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommandReceipt'
        '200':
          description: Committed same-input idempotent replay
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommandReceipt'
        '400': { $ref: '#/components/responses/Problem400' }
        '404': { $ref: '#/components/responses/Problem404' }
        '409': { $ref: '#/components/responses/Problem409' }
        '422': { $ref: '#/components/responses/Problem422' }
        '500': { $ref: '#/components/responses/Problem500' }
        '503': { $ref: '#/components/responses/Problem503' }

  /api/v1/approved-strategies/{approvedStrategyVersionId}:
    get:
      tags: [Human Review]
      operationId: getApprovedStrategy
      summary: Read an immutable Approved Strategy version
      parameters:
        - $ref: '#/components/parameters/ApprovedStrategyVersionId'
      responses:
        '200':
          description: Approved Strategy version
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApprovedStrategyVersion'
        '404': { $ref: '#/components/responses/Problem404' }
        '500': { $ref: '#/components/responses/Problem500' }
        '503': { $ref: '#/components/responses/Problem503' }

  /api/v1/approved-strategies/{approvedStrategyVersionId}/commands/withdraw:
    post:
      tags: [Human Review]
      operationId: withdrawApprovedStrategy
      summary: Withdraw an Approved Strategy without automatically rerunning
      parameters:
        - $ref: '#/components/parameters/ApprovedStrategyVersionId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WithdrawApprovedStrategyRequest'
      responses:
        '201':
          description: Withdrawal and a new Review Cycle are recorded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReviewOutcomeResult'
        '200':
          description: Committed same-input idempotent replay
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReviewOutcomeResult'
        '400': { $ref: '#/components/responses/Problem400' }
        '404': { $ref: '#/components/responses/Problem404' }
        '409': { $ref: '#/components/responses/Problem409' }
        '422': { $ref: '#/components/responses/Problem422' }
        '500': { $ref: '#/components/responses/Problem500' }
        '503': { $ref: '#/components/responses/Problem503' }

  /api/v1/tasks/{taskId}/marketing-briefs:
    get:
      tags: [Marketing Brief]
      operationId: listMarketingBriefs
      summary: List a bounded recent window of Marketing Brief versions
      parameters:
