[alembic]
script_location = %(here)s/migrations
prepend_sys_path = %(here)s/src
path_separator = os

# A URL is intentionally not committed here.  The explicit migration
# operator supplies MVP0_BUSINESS_DATABASE_URL (or a caller may set this
# option in a private Alembic Config).  This prevents package import or an
# accidental bare command from selecting the shared demo database.
sqlalchemy.url =

# Business Alembic owns one schema at a time.  ``public`` is the production
# Business default; isolated migration tests override both values with a
# fixed test-owned schema.
business_schema = public
version_table = alembic_version
version_table_schema = public

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
