; Fixture contract suite (FND-002).
;
; This configuration mirrors the production contracts in
; apps/backend/pyproject.toml one-to-one (same contract names and types),
; rooted at the test-only `fixture_pkg` package that each fixture directory
; provides. `test_import_contracts.py` asserts the mirror stays in sync, so
; fixture evidence always corresponds to the real production contract set.
;
; See tests/architecture/README.md for the fixture strategy.

[importlinter]
root_packages =
    fixture_pkg
include_external_packages = True

[importlinter:contract:Production and Spike isolation]
name = Production and Spike isolation
type = forbidden
source_modules =
    fixture_pkg
    fixture_pkg.*
forbidden_modules =
    spikes
    prototypes

[importlinter:contract:Module layer direction]
name = Module layer direction
type = layers
containers =
    fixture_pkg.modules.*
layers =
    (infrastructure)
    (application)
    (domain)

[importlinter:contract:Top-level package direction]
name = Top-level package direction
type = layers
layers =
    (fixture_pkg.entrypoints)
    (fixture_pkg.orchestration)
    (fixture_pkg.modules)
    (fixture_pkg.platform)
    (fixture_pkg.application)
    (fixture_pkg.shared_kernel)

[importlinter:contract:Domain internal dependencies]
name = Domain internal dependencies
type = forbidden
source_modules =
    fixture_pkg.modules.*.domain
forbidden_modules =
    fixture_pkg.platform
    fixture_pkg.orchestration
    fixture_pkg.entrypoints
    fixture_pkg.bootstrap

[importlinter:contract:Domain external dependencies]
name = Domain external dependencies
type = forbidden
source_modules =
    fixture_pkg.modules.*.domain
forbidden_modules =
    langgraph
    sqlalchemy
    django
    flask
    fastapi
    starlette
    openai
    anthropic

[importlinter:contract:Application internal dependencies]
name = Application internal dependencies
type = forbidden
source_modules =
    fixture_pkg.modules.*.application
    fixture_pkg.application.*
forbidden_modules =
    fixture_pkg.platform
    fixture_pkg.orchestration
    fixture_pkg.entrypoints
    fixture_pkg.bootstrap

[importlinter:contract:Application external dependencies]
name = Application external dependencies
type = forbidden
source_modules =
    fixture_pkg.modules.*.application
    fixture_pkg.application.*
forbidden_modules =
    langgraph
    sqlalchemy
    django
    flask
    fastapi
    starlette
    openai
    anthropic

[importlinter:contract:Bootstrap not imported by core]
name = Bootstrap not imported by core
type = forbidden
source_modules =
    fixture_pkg.modules.*
    fixture_pkg.application.*
    fixture_pkg.platform.*
    fixture_pkg.shared_kernel.*
forbidden_modules =
    fixture_pkg.bootstrap

[importlinter:contract:Orchestration external dependencies]
name = Orchestration external dependencies
type = forbidden
source_modules =
    fixture_pkg.orchestration.*
forbidden_modules =
    sqlalchemy
    django
    flask
    fastapi
    starlette
    openai
    anthropic

[importlinter:contract:Entrypoint external dependencies]
name = Entrypoint external dependencies
type = forbidden
source_modules =
    fixture_pkg.entrypoints.*
forbidden_modules =
    langgraph
    sqlalchemy
    django
    openai
    anthropic
