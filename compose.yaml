services:
  postgres:
    image: postgres:16.14-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${MVP0_ADMIN_USER:-mvp0_admin}
      POSTGRES_PASSWORD: ${MVP0_ADMIN_PASSWORD:-mvp0_admin_local_only}
      # The image creates this bootstrap database. The init script then creates
      # the two application databases below and grants each role only its own
      # database CONNECT privilege.
      POSTGRES_DB: postgres
      MVP0_BUSINESS_DB: ${MVP0_BUSINESS_DB:-ecommerce_business}
      MVP0_BUSINESS_ROLE: ${MVP0_BUSINESS_ROLE:-mvp0_business}
      MVP0_BUSINESS_PASSWORD: ${MVP0_BUSINESS_PASSWORD:-mvp0_business_local_only}
      MVP0_CHECKPOINT_DB: ${MVP0_CHECKPOINT_DB:-ecommerce_checkpoint}
      MVP0_CHECKPOINT_ROLE: ${MVP0_CHECKPOINT_ROLE:-mvp0_checkpoint}
      MVP0_CHECKPOINT_PASSWORD: ${MVP0_CHECKPOINT_PASSWORD:-mvp0_checkpoint_local_only}
    ports:
      - "127.0.0.1:${MVP0_POSTGRES_PORT:-55432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./scripts/mvp0/postgres-init.sh:/docker-entrypoint-initdb.d/20-mvp0-databases.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready --username \"$${POSTGRES_USER}\" --dbname postgres"]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 5s

  api:
    profiles: ["local-web"]
    build:
      context: .
      dockerfile: apps/backend/Dockerfile.local
    restart: unless-stopped
    environment:
      MVP0_BUSINESS_DATABASE_URL: postgresql+psycopg://${MVP0_BUSINESS_ROLE:-mvp0_business}:${MVP0_BUSINESS_PASSWORD:-mvp0_business_local_only}@postgres:5432/${MVP0_BUSINESS_DB:-ecommerce_business}
      MVP0_LOCAL_DEMO_DATABASE_URL: postgresql+psycopg://${MVP0_BUSINESS_ROLE:-mvp0_business}:${MVP0_BUSINESS_PASSWORD:-mvp0_business_local_only}@postgres:5432/${MVP0_BUSINESS_DB:-ecommerce_business}
      MVP0_LOCAL_DEMO_WORKSPACE_ID: local-demo
      MVP0_LOCAL_DEMO_WORKBENCH_ORIGIN: http://127.0.0.1:5173
    expose:
      - "8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/tasks?limit=1', timeout=2)",
        ]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 10s

  web:
    profiles: ["local-web"]
    build:
      context: .
      dockerfile: apps/web/Dockerfile.local
    restart: unless-stopped
    ports:
      - "127.0.0.1:5173:8080"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/tasks"]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 5s

volumes:
  postgres-data:
    name: ${MVP0_POSTGRES_VOLUME_NAME:-ai-ecommerce-agent-mvp0-postgres-data}
