# Backend deterministic test gate (FND-003, RFC-001-DQ-09).
#
# Local Configuration = CI Configuration: every step reuses the exact
# commands from apps/backend/README.md. No CI-only test rules exist.
# `live`-marked tests (real external network or providers) never run here.
#
# Stable check names (referenced by branch protection):
#   test / unit-contract
#   test / package-build
name: test

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# New commits on a pull request cancel that PR's previous run; post-merge
# verification on main is never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

defaults:
  run:
    working-directory: apps/backend

jobs:
  unit-contract:
    name: test / unit-contract
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install uv and Python
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          version: "0.12.0"
          python-version: "3.13.14"
          enable-cache: true
          cache-dependency-glob: apps/backend/uv.lock
          cache-suffix: py3.13.14
      - name: Install locked dependencies (uv sync --locked)
        run: uv sync --locked
      - name: Unit tests (pytest -m unit)
        run: uv run pytest -m unit
      - name: Contract tests (pytest -m contract)
        run: uv run pytest -m contract
      - name: Fast suite (pytest -m "not live and not slow")
        run: uv run pytest -m "not live and not slow"

  package-build:
    name: test / package-build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install uv and Python
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          version: "0.12.0"
          python-version: "3.13.14"
          enable-cache: true
          cache-dependency-glob: apps/backend/uv.lock
          cache-suffix: py3.13.14
      - name: Install locked dependencies (uv sync --locked)
        run: uv sync --locked
      # Lockfile drift fails here: pyproject.toml changed without uv.lock.
      # (uv sync --locked above is the first drift gate; this makes the
      # lockfile-vs-sources check explicit and independent of any install.)
      - name: Verify lockfile is up to date (uv lock --check)
        run: uv lock --check
      - name: Build package (uv build)
        run: uv build
      - name: Package import regression (isolated venv, built wheel)
        run: |
          set -euo pipefail
          uv venv /tmp/import-regression
          VIRTUAL_ENV=/tmp/import-regression uv pip install dist/ai_ecommerce_agent-*.whl
          /tmp/import-regression/bin/python - <<'PY'
          import importlib.resources as resources

          import ai_ecommerce_agent

          assert resources.files("ai_ecommerce_agent").joinpath("py.typed").is_file()
          print("package import OK; py.typed present")
          PY
