[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ts-03-langgraph-checkpoint-compatibility"
version = "0.1.0"
description = "Bounded MVP0-005 evidence for synchronous LangGraph PostgresSaver isolation and reconciliation."
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "langgraph==1.2.9",
    "langgraph-checkpoint-postgres==3.1.1",
    "psycopg[binary]==3.2.10",
    "psycopg-pool==3.2.6",
]

[dependency-groups]
dev = [
    "pyright==1.1.407",
    "pytest==9.0.3",
    "ruff==0.14.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/ts03_checkpoint"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-q", "--strict-markers", "--strict-config"]
markers = [
    "unit: deterministic pure tests with no external resources",
    "integration: bounded tests against the dedicated local PostgreSQL Checkpoint DB",
]

[tool.ruff]
target-version = "py313"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP"]

[tool.pyright]
typeCheckingMode = "strict"
pythonVersion = "3.13"
include = ["src", "tests"]
venvPath = "."
venv = ".venv"
reportMissingTypeStubs = false
reportUnknownArgumentType = false
reportUnknownMemberType = false
reportUnknownVariableType = false
reportTypedDictNotRequiredAccess = false
