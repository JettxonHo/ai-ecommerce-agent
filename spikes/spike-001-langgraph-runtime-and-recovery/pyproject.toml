[project]
name = "spike-001-langgraph-runtime-and-recovery"
version = "0.1.0"
description = "Spike-001: LangGraph Runtime and Recovery (DEC-034/035/036/037). Minimal, deterministic, disposable architecture validation — NOT production code."
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    # DEC-035: exact-pinned LangGraph runtime (temporary stack, not a production commitment)
    "langgraph==1.2.9",
    "langgraph-checkpoint-sqlite==3.1.0",
]

[dependency-groups]
dev = [
    "pytest==8.4.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/spike_runtime"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "unit: unit tests",
    "integration: integration tests",
    "failure_injection: fault-injection tests",
    "e2e: end-to-end scenario tests",
    "optional_external: optional tests requiring external secrets (auto-skip without secret)",
]
